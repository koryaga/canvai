<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>DOM Agent</title>
<style>
  body { margin: 0; font: 15px/1.55 system-ui, -apple-system, sans-serif; }
  #app { min-height: 60vh; padding: 16px 20px; outline: none; }
  #io { position: sticky; bottom: 0; display: flex; gap: 10px; align-items: center;
        padding: 8px 20px; background: #f2f2f2; border-top: 1px solid #d8d8d8; }
  #io .grow { flex: 1; }
  #state { font-weight: 600; }
  #count { color: #666; font-size: 13px; }
  #debug { padding: 6px 20px 20px; background: #fbfbfb; border-top: 1px solid #e4e4e4;
           font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; }
  #log { white-space: pre-wrap; max-height: 45vh; overflow: auto; }
  #log > div { padding: 2px 0; border-bottom: 1px solid #efefef; }
  aside[data-ask] { display: block; margin: 6px 0 6px 28px; padding: 6px 10px;
                    background: #fff7c2; border-left: 3px solid #dcbf14;
                    font-size: 14px; border-radius: 3px; }
  aside[data-ask]::before { content: attr(data-ask) " "; color: #9a8600; font-size: 12px; }
</style>

<div id="app" contenteditable="true" spellcheck="false"></div>
<div id="store" hidden></div>
<div id="io">
  <span id="state">ready</span>
  <span id="count"></span>
  <span class="grow"></span>
  <button id="send" type="button">send</button>
  <button id="stop" type="button" disabled>stop</button>
</div>
<details id="debug" open>
  <summary>log</summary>
  <div id="log"></div>
</details>

<script>
"use strict";

// ---- 0. Config -------------------------------------------------------------
const API_URL = "https://openrouter.ai/api/v1/chat/completions";
const API_KEY = "";   // min.html IS TRACKED by git: paste your key here to run,
                      // blank it before committing. A pre-commit hook refuses any
                      // commit that carries one.
const MODEL   = "openrouter/free";

const MAX_ITERS  = 12;
const MAX_RESULT = 4000;
const MAX_DIFF   = 60;
const CUT        = 200;

// ---- 1. Scaffolding --------------------------------------------------------
const app     = document.getElementById("app");
const store   = document.getElementById("store");
const io      = document.getElementById("io");
const debugEl = document.getElementById("debug");
const logEl   = document.getElementById("log");
const stateEl = document.getElementById("state");
const countEl = document.getElementById("count");
const sendBtn = document.getElementById("send");
const stopBtn = document.getElementById("stop");

function log(kind, text) {
  const line = document.createElement("div");
  line.textContent = "[" + kind + "] " + text;
  logEl.appendChild(line);
  logEl.scrollTop = logEl.scrollHeight;
}

function updateCount() {
  const a = app.querySelectorAll("[data-ask]").length;
  const d = buf.size + adds.length + dels.length;
  const p = [];
  if (a) p.push(a + " note(s)");
  if (d) p.push(d + " edit(s)");
  countEl.textContent = p.length ? "pending: " + p.join(", ") : "";
}

// ---- 2. Observer -----------------------------------------------------------
let execWindow = false;

// §4.4: the Map coalesces characterData and attributes only — for those the
// "old" value goes stale by the time the record is handled. For childList the
// old state lives in the record itself, and coalescing it by path would merge
// distinct added or removed nodes into one.
const buf  = new Map();
const adds = [];
const dels = [];

function inAsk(node) {
  const el = node && node.nodeType === 1 ? node : (node ? node.parentElement : null);
  return !!(el && el.closest && el.closest("[data-ask]"));
}

// Raw value, for COMPARISON. clip() truncates at CUT and collapses whitespace,
// so two genuinely different strings that diverge past character 200 compare
// equal — and the human's edit vanishes with no trace. Clip for display only.
function raw(v) { return v == null ? "" : String(v); }

// §4.6: #id when present; otherwise a tag:nth-of-type(n) chain up to the
// nearest ancestor with an id, prefixed #app. A text node is addressed by its
// parent.
function pathOf(node) {
  let el = node && node.nodeType === 1 ? node : (node ? node.parentElement : null);
  if (!el) return "?";
  const parts = [];
  while (el && el !== app) {
    if (el.id) { parts.unshift("#" + el.id); return parts.join(" > "); }
    const tag = el.tagName.toLowerCase();
    let n = 1;
    for (let s = el.previousElementSibling; s; s = s.previousElementSibling) {
      if (s.tagName === el.tagName) n++;
    }
    parts.unshift(tag + ":nth-of-type(" + n + ")");
    el = el.parentElement;
  }
  parts.unshift("#app");
  return parts.join(" > ");
}

function nodeBrief(n) {
  if (n.nodeType === 1) return clip(n.outerHTML);
  return "«" + clip(n.textContent) + "»";
}

// §4.2: records arriving inside the execution window are discarded — those are
// the model's edits. Attribution is by window, not by isTrusted: innerHTML
// produces no events at all.
function process(records) {
  if (execWindow) return;
  for (const r of records) {
    if (inAsk(r.target)) continue;      // §5: typing in a note is not a document edit

    if (r.type === "childList") {
      for (const n of r.addedNodes)   { if (!inAsk(n)) adds.push({ where: pathOf(r.target), what: nodeBrief(n) }); }
      for (const n of r.removedNodes) { if (!inAsk(n)) dels.push({ where: pathOf(r.target), what: nodeBrief(n) }); }
    } else if (r.type === "characterData") {
      // Key by the node itself, not by path: pathOf addresses a text node by
      // its parent, so two text children of one element
      // (<p>start <b>b</b> end</p>) would collapse into a single key and the
      // second edit would be lost without a trace.
      if (!buf.has(r.target)) {
        buf.set(r.target, { kind: "text", path: pathOf(r.target), node: r.target,
                            old: raw(r.oldValue) });
      }
    } else if (r.type === "attributes") {
      // Elements are addressed unambiguously by path, so no collision here.
      const k = "attr|" + pathOf(r.target) + "|" + r.attributeName;
      if (!buf.has(k)) {
        buf.set(k, { kind: "attr", path: pathOf(r.target), node: r.target,
                     name: r.attributeName, old: raw(r.oldValue) });
      }
    }
  }
  updateCount();
}

const observer = new MutationObserver(process);
observer.observe(app, {
  childList: true, subtree: true, characterData: true,
  attributes: true, attributeOldValue: true, characterDataOldValue: true
});

// §4.5: takeRecords() CLEARS the queue. Its result must go through process(),
// or the last tick's human edits are silently lost. Inside the window process()
// discards them itself — that is the "throw the result away" of §4.2.
function drain() { process(observer.takeRecords()); }

// §4.3: .value and .checked are invisible to MutationObserver. Dedicated
// listeners are the only way to see that the human filled a field in.
function fieldValue(el) {
  return (el.type === "checkbox" || el.type === "radio")
    ? String(el.checked) : String(el.value);
}

app.addEventListener("focusin", function (e) {
  const el = e.target;
  if (el && el.matches && el.matches("input,select,textarea")) el.__was = fieldValue(el);
}, true);

function fieldChanged(e) {
  // Programmatic assignment to .value fires no events, so this filter rejects
  // only synthetic events coming from the model's own code.
  if (!e.isTrusted) return;
  const el = e.target;
  if (!el || !el.matches || !el.matches("input,select,textarea")) return;
  if (inAsk(el)) return;
  const k = "field|" + pathOf(el);
  if (!buf.has(k)) {
    buf.set(k, {
      kind:  "field",
      path:  pathOf(el),
      node:  el,
      check: el.type === "checkbox" || el.type === "radio",
      old:   raw(el.__was === undefined ? "" : el.__was)
    });
  }
  updateCount();
}

app.addEventListener("input",  fieldChanged, true);
app.addEventListener("change", fieldChanged, true);

// Reseat the baseline: once a turn is sent, current field values become the
// "old" ones, or the next turn repeats the same edit.
function reseat() {
  for (const el of app.querySelectorAll("input,select,textarea")) el.__was = fieldValue(el);
}

// ---- 3. Notes --------------------------------------------------------------
let nid = 0;

function ensureId(el) {
  if (!el.id) {
    do { nid++; } while (document.getElementById("n" + nid));
    el.id = "n" + nid;
  }
  return el.id;
}

function topLevel(node) {
  let el = node && node.nodeType === 1 ? node : (node ? node.parentNode : null);
  while (el && el.parentNode && el.parentNode !== app) el = el.parentNode;
  return el && el.parentNode === app ? el : null;
}

function addAsk() {
  drain();                           // take other records BEFORE raising the
  const prevWindow = execWindow;     // window. A model turn may have raised it:
  execWindow = true;                 // the canvas is not blocked during a turn,
  try {                              // so the human can add a note mid-turn.
    const sel = document.getSelection();
    const from = sel && sel.anchorNode && app.contains(sel.anchorNode) ? sel.anchorNode : null;
    let anchor = from ? topLevel(from) : null;
    // A bare text node directly under #app: that is how Chrome keeps the first
    // line until the human presses Enter. There is no element child, and the
    // anchor needs a node that can carry an id — wrap it in a <p> in place.
    if (!anchor && from && from.nodeType === 3 && from.parentNode === app) {
      anchor = document.createElement("p");
      from.before(anchor);
      anchor.appendChild(from);
    }
    if (!anchor) anchor = app.lastElementChild;
    if (!anchor) {
      anchor = document.createElement("p");
      anchor.textContent = " ";
      app.appendChild(anchor);
    }
    if (anchor.matches("[data-ask]")) return;

    const id = ensureId(anchor);
    const aside = document.createElement("aside");
    aside.setAttribute("data-ask", "#" + id);
    aside.setAttribute("contenteditable", "true");
    anchor.after(aside);

    const r = document.createRange();
    r.selectNodeContents(aside);
    r.collapse(true);
    const s = document.getSelection();
    s.removeAllRanges();
    s.addRange(r);
    aside.focus();
    updateCount();
    return aside;
  } finally {
    drain();                         // records of our own edits go to the bin
    execWindow = prevWindow;
  }
}

function collectAsks() {
  const out = [];
  const nodes = Array.prototype.slice.call(app.querySelectorAll("[data-ask]"));
  for (const a of nodes) {
    const text = a.textContent.replace(/\s+/g, " ").trim();
    if (text) out.push("[on " + a.getAttribute("data-ask") + "] " + text);
    a.remove();
  }
  return out;
}

// ---- 4. Diff ---------------------------------------------------------------
function clip(s) {
  s = String(s == null ? "" : s).replace(/\s+/g, " ").trim();
  return s.length > CUT ? s.slice(0, CUT) + "…" : s;
}

function diffLines() {
  const out = [];
  for (const e of buf.values()) {
    if (e.kind === "text") {
      const now = raw(e.node.nodeValue);
      if (now !== e.old) {
        out.push(e.path + " text: «" + clip(e.old) + "» → «" + clip(now) + "»");
      }
    } else if (e.kind === "attr") {
      const now = raw(e.node.getAttribute ? e.node.getAttribute(e.name) : null);
      if (now !== e.old) {
        out.push(e.path + " @" + e.name + ": «" + clip(e.old) + "» → «" + clip(now) + "»");
      }
    } else if (e.kind === "field") {
      const now = raw(fieldValue(e.node));
      if (now !== e.old) {
        out.push(e.path + (e.check ? " checkbox: «" : " field: «") +
                 clip(e.old) + "» → «" + clip(now) + "»");
      }
    }
  }
  for (const a of adds) out.push(a.where + " + " + a.what);
  for (const d of dels) out.push(d.where + " − " + d.what);

  buf.clear();
  adds.length = 0;
  dels.length = 0;

  if (out.length > MAX_DIFF) {
    const n = out.length;
    out.length = MAX_DIFF;
    out.push("… " + (n - MAX_DIFF) + " more edit(s) not shown");
  }
  return out;
}

// Atomic block (§6): not one await between draining records and stripping the
// notes. Otherwise the human types in the gap and the text is lost.
function takeDiff() {
  drain();                       // 1. pick up the human's last-tick edits
  const lines = diffLines();     // 2. assemble the diff and clear the buffers
  execWindow = true;             // 3. stripping notes is a system edit, not a human one
  let asks;
  try {
    asks = collectAsks();
    reseat();                    // §6: reseat the baseline in the same block
  } finally {
    drain();                     // execWindow still true → removal records to the bin
    execWindow = false;
  }
  updateCount();
  return { asks: asks, lines: lines };
}

function turnMessage(d) {
  const parts = [];
  if (d.asks.length)  parts.push("INSTRUCTIONS (" + d.asks.length + "):\n" + d.asks.join("\n"));
  if (d.lines.length) parts.push("DOCUMENT EDITS (" + d.lines.length + "):\n" + d.lines.join("\n"));
  return parts.length ? parts.join("\n\n") : "The human submitted a turn without changing anything.";
}

// ---- 5. Execution ----------------------------------------------------------
function serialize(v) {
  if (v === undefined) return "ok";
  if (typeof v === "string") return v;
  if (v instanceof Node) {
    return v.outerHTML !== undefined ? v.outerHTML : String(v.textContent);
  }
  if (v instanceof NodeList || Array.isArray(v)) {
    return Array.from(v).map(function (x) {
      if (x instanceof Node) return x.outerHTML !== undefined ? x.outerHTML : String(x.textContent);
      try { return JSON.stringify(x); } catch (e) { return String(x); }
    }).join("\n");
  }
  try {
    const s = JSON.stringify(v);
    return s === undefined ? String(v) : s;
  } catch (e) {
    return String(v);
  }
}

function cut(s) {
  s = String(s);
  return s.length > MAX_RESULT
    ? s.slice(0, MAX_RESULT) + "\n… truncated, " + s.length + " chars total"
    : s;
}

function errText(e) {
  const name = e && e.name ? e.name : "Error";
  const msg  = e && e.message ? e.message : String(e);
  const head = name + ": " + msg;
  // Cap not just the number of stack lines but each line's length: a frame can
  // be arbitrarily long (on a page served as data: it carries the entire
  // source), and the model would then get MAX_RESULT characters of noise
  // instead of a diagnosis — along with everything the source contains.
  const st = e && e.stack
    ? String(e.stack).split("\n").slice(1, 4)
        .map(function (l) { return l.length > CUT ? l.slice(0, CUT) + "…" : l; })
        .join("\n")
    : "";
  return st ? head + "\n" + st : head;
}

function exec(code) {
  const fn = new Function("return (async () => {" + code + "})()");
  return fn();
}

async function runTool(code) {
  execWindow = true;
  try {
    const v = await exec(code);
    return { text: cut(serialize(v)), err: null };
  } catch (e) {
    return { text: cut(errText(e)), err: e };
  } finally {
    drain();            // §4.2: the observer callback is async — drain and discard
    execWindow = false; // BEFORE lowering the flag, or model edits land on the human
  }
}

function checkFrame() {
  // Every scaffolding node, not just the containers: #debug.innerHTML = ""
  // leaves the container connected while log() writes into a detached #log.
  const parts = [["app", app], ["store", store], ["io", io], ["debug", debugEl],
                 ["log", logEl], ["state", stateEl], ["count", countEl],
                 ["send", sendBtn], ["stop", stopBtn]];
  let ok = true;
  for (const [id, node] of parts) {
    if (document.getElementById(id) !== node || !node.isConnected) { ok = false; break; }
  }
  if (!ok) {
    alert("Page scaffolding destroyed. Reloading.");
    location.reload();
  }
  return ok;
}

// ---- 6. Loop ---------------------------------------------------------------
const SYSTEM = `You live inside a single HTML page. Your only action is the page_exec tool: it runs the JavaScript you pass in this page and returns to you whatever value the code returned.

The code runs as the body of an async function. To see a value you must return it: without a return you get "ok" and will conclude the call succeeded while having read nothing. await is available.

You are never sent a snapshot of the page. If you need to know the state, read it yourself with page_exec.

Page map:
- #app — the canvas, contenteditable. It is at once the human's document and your answer to them. Your answer to the human is what is written here, not the text of your message.
- #store — a hidden data layer (hidden attribute). Keep state here, not in #app markup.
- #io and #debug — the system scaffolding. Do not touch them, and do not touch body as a whole.

A human turn arrives in two sections:
- INSTRUCTIONS — a task anchored to a node. This is what is wanted from you.
- DOCUMENT EDITS — the new state of the text after the human's edits. Usually context; it needs no action.
Notes have already been stripped from the page by this point; do not restore them.

Rules:
- State survives the turn. Do not re-emit what is already written on the page.
- Put an id on any node you intend to read in a later turn.
- #app is editable throughout, and that is valuable: the human edits text by hand and you receive those edits as the DOCUMENT EDITS section. Do not take that away from them.
- Put contenteditable="false" on the interactive element ITSELF — a button, input, select — and only on it, or a click will place the caret instead of pressing it.
- The attribute is inherited: contenteditable="false" on a container disables editing of everything inside. Never put it on a paragraph, list, table or cell — the human will stop being able to edit them. If a non-editable island needs an editable field inside, put contenteditable="true" on that field explicitly.
- Text the human is meant to edit must stay editable, and carry an id so you can read it back.
- Always check the result of querySelector against null: the human's caret breaks structure and carries ids away with it.
- Text the human types into an input lives in the .value property, not in the markup — outerHTML does not show it. Read .value and .checked.
- If your code throws, you get the exception as text. That is the normal way to repair yourself: fix the code and retry.`;

const TOOLS = [{
  type: "function",
  function: {
    name: "page_exec",
    description: "Run JavaScript in the current page. The code runs as the body of an async function: return your result, or you get \"ok\". await is available.",
    parameters: {
      type: "object",
      properties: { code: { type: "string" } },
      required: ["code"]
    }
  }
}];

const messages = [{ role: "system", content: SYSTEM }];
let busy = false;
let ctl = null;

function setBusy(v) {
  busy = v;
  stateEl.textContent = v ? "working" : "ready";
  sendBtn.disabled = v;
  stopBtn.disabled = !v;
  // The canvas is read-only for the duration of a turn. An edit made inside the
  // execution window would be attributed to the model and vanish silently
  // (§10, authorship race): the DOM changes while the diff says "nothing
  // changed". Forbidding is cheaper than losing.
  // Notes still work: <aside> carries its own contenteditable="true", and its
  // text is read from the DOM at commit time rather than from the observer
  // buffer — so it survives the turn.
  // Flipping the attribute is the system's own edit, hence inside the window:
  // otherwise the observer buffers it and the counter shows the human an edit
  // they never made.
  const prev = execWindow;
  execWindow = true;
  try { app.contentEditable = v ? "false" : "true"; }
  finally { drain(); execWindow = prev; }
}

async function callModel(extra) {
  const body = { model: MODEL, messages: messages, tools: TOOLS };
  if (extra) Object.assign(body, extra);
  const r = await fetch(API_URL, {
    method: "POST",
    headers: { "content-type": "application/json", "authorization": "Bearer " + API_KEY },
    body: JSON.stringify(body),
    signal: ctl.signal
  });
  if (!r.ok) {
    const t = await r.text();
    throw new Error("HTTP " + r.status + ": " + t.slice(0, 500));
  }
  return await r.json();
}

// A turn can end mid-batch while `messages` outlives the turn. A call left
// without its tool reply makes EVERY subsequent request of the session invalid:
// the provider sees assistant.tool_calls with too few answers and returns 400
// on turns that look unrelated.
function closeBatch(calls, after) {
  for (const rest of calls.slice(calls.indexOf(after) + 1)) {
    messages.push({ role: "tool", tool_call_id: rest.id || "unknown",
                    content: "Turn ended early; this call was not executed." });
  }
}

async function runTurn() {
  let lastSig = "";
  let same = 0;

  for (let i = 1; i <= MAX_ITERS + 1; i++) {
    const last = i > MAX_ITERS;
    if (last) {
      messages.push({
        role: "user",
        content: "Iteration limit reached. Wrap up the turn: briefly say what is done and what is left."
      });
      log("limit", "MAX_ITERS reached, final call with tool_choice: none");
    }

    const data = await callModel(last ? { tool_choice: "none" } : null);
    const ch = data.choices && data.choices[0];
    if (!ch) { log("failure", "response without choices: " + JSON.stringify(data).slice(0, 500)); return; }

    const m = ch.message;
    if (!m) {
      log("failure", "response without message: " + JSON.stringify(ch).slice(0, 500));
      return;
    }
    const fin = ch.finish_reason;
    const calls = m.tool_calls || [];
    messages.push(m);
    if (m.content) log("text", m.content);

    // Deviation from §7: the criterion is a non-empty tool_calls.
    // OpenAI-compatible clones frequently lie about finish_reason; the
    // disagreement is recorded in the log.
    if (calls.length && fin !== "tool_calls") {
      log("provider", "tool_calls non-empty but finish_reason = " + fin);
    }
    if (!calls.length) { log("turn", "done, finish_reason = " + fin); return; }

    for (const c of calls) {
      let code = null;
      try {
        code = JSON.parse(c.function.arguments).code;
      } catch (e) {
        const out = "Could not parse the call arguments: " + errText(e) +
                    "\nThe response was probably cut off by the token limit. Send shorter code.";
        log("arguments", out);
        messages.push({ role: "tool", tool_call_id: c.id || "unknown", content: out });
        continue;
      }

      // Arguments parsed but there is no code field: runTool(undefined) would
      // return "ok" and the model would take the call for a success. It gets no
      // snapshot of the page and cannot catch the lie.
      if (typeof code !== "string") {
        const out = "The call arguments have no string field `code`. " +
                    "Retry the call with the code in the `code` field.";
        log("arguments", out);
        messages.push({ role: "tool", tool_call_id: c.id || "unknown", content: out });
        continue;
      }

      log("exec", code);
      const res = await runTool(code);
      log(res.err ? "error" : "result", res.text);
      messages.push({ role: "tool", tool_call_id: c.id || "unknown", content: res.text });

      if (res.err) {
        const sig = (res.err.name || "Error") + ": " + (res.err.message || "");
        if (sig === lastSig) same++; else { lastSig = sig; same = 1; }
        if (same >= 3) {
          log("stop", "three identical exceptions in a row, turn ended by force");
          closeBatch(calls, c);
          return;
        }
      } else {
        lastSig = ""; same = 0;
      }

      if (!checkFrame()) return;
    }

    if (last) return;
  }
}

async function commit() {
  if (busy) { log("busy", "a turn is already running, send skipped"); return; }
  const msg = turnMessage(takeDiff());
  log("turn", msg);
  messages.push({ role: "user", content: msg });
  ctl = new AbortController();
  setBusy(true);
  try {
    await runTurn();
  } catch (e) {
    if (e && e.name === "AbortError") log("stop", "turn aborted by the human");
    else log("failure", errText(e));
  } finally {
    setBusy(false);
    ctl = null;
  }
}

// ---- 7. Bindings -----------------------------------------------------------
app.addEventListener("contextmenu", function (e) {
  if (e.shiftKey) return;            // Shift leaves the browser's own menu
  e.preventDefault();
  addAsk();
});

app.addEventListener("keydown", function (e) {
  // By physical key: on a non-Latin layout e.key for Slash is not "/"
  if ((e.ctrlKey || e.metaKey) && e.code === "Slash") { e.preventDefault(); addAsk(); }
});

// Escape is bound on document, not on #app: a freshly created empty <aside>
// leaves focus on <body> (aside.focus() does not take on an empty
// contenteditable), and the listener on #app would never see the event. The
// note is located by the caret rather than only by the event target, for the
// same reason: the selection sits inside the note even when activeElement is
// <body>.
document.addEventListener("keydown", function (e) {
  if (e.key !== "Escape") return;
  let a = e.target && e.target.closest ? e.target.closest("[data-ask]") : null;
  if (!a) {
    const sel = document.getSelection();
    const n = sel ? sel.anchorNode : null;
    const el = n ? (n.nodeType === 1 ? n : n.parentElement) : null;
    a = el && el.closest ? el.closest("[data-ask]") : null;
  }
  if (a && app.contains(a) && !a.textContent.trim()) {
    e.preventDefault();
    a.remove();          // removing a note stays out of the diff: inAsk catches the node
    app.focus();
    updateCount();
  }
});

app.addEventListener("input", updateCount);

document.addEventListener("keydown", function (e) {
  if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); commit(); }
});

sendBtn.addEventListener("click", function () { commit(); });

stopBtn.addEventListener("click", function () { if (ctl) ctl.abort(); });

log("start", "scaffolding up");
</script>

<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<title>DOM-агент</title>
<style>
  body { margin: 0; font: 15px/1.55 system-ui, -apple-system, sans-serif; }
  #app { min-height: 60vh; padding: 16px 20px; outline: none; }
  #io { position: sticky; bottom: 0; display: flex; gap: 10px; align-items: center;
        padding: 8px 20px; background: #f2f2f2; border-top: 1px solid #d8d8d8; }
  #io .grow { flex: 1; }
  #state { font-weight: 600; }
  #count { color: #666; font-size: 13px; }
  #debug { padding: 6px 20px 20px; background: #fbfbfb; border-top: 1px solid #e4e4e4;
           font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; }
  #log { white-space: pre-wrap; max-height: 45vh; overflow: auto; }
  #log > div { padding: 2px 0; border-bottom: 1px solid #efefef; }
  aside[data-ask] { display: block; margin: 6px 0 6px 28px; padding: 6px 10px;
                    background: #fff7c2; border-left: 3px solid #dcbf14;
                    font-size: 14px; border-radius: 3px; }
  aside[data-ask]::before { content: attr(data-ask) " "; color: #9a8600; font-size: 12px; }
</style>

<div id="app" contenteditable="true" spellcheck="false"></div>
<div id="store" hidden></div>
<div id="io">
  <span id="state">готов</span>
  <span id="count"></span>
  <span class="grow"></span>
  <button id="send" type="button">отправить</button>
  <button id="stop" type="button" disabled>стоп</button>
</div>
<details id="debug" open>
  <summary>журнал</summary>
  <div id="log"></div>
</details>

<script>
"use strict";

// ---- 0. Конфиг -------------------------------------------------------------
const API_URL = "https://api.deepseek.com/v1/chat/completions";
const API_KEY = "";   // min.html ОТСЛЕЖИВАЕТСЯ git. Ключ вписывать в копию
                      // min.local.html (она в .gitignore) либо очищать перед коммитом.
const MODEL   = "deepseek-v4-flash";

const MAX_ITERS  = 12;
const MAX_RESULT = 4000;
const MAX_DIFF   = 60;
const CUT        = 200;

// ---- 1. Каркас -------------------------------------------------------------
const app     = document.getElementById("app");
const store   = document.getElementById("store");
const io      = document.getElementById("io");
const debugEl = document.getElementById("debug");
const logEl   = document.getElementById("log");
const stateEl = document.getElementById("state");
const countEl = document.getElementById("count");
const sendBtn = document.getElementById("send");
const stopBtn = document.getElementById("stop");

function log(kind, text) {
  const line = document.createElement("div");
  line.textContent = "[" + kind + "] " + text;
  logEl.appendChild(line);
  logEl.scrollTop = logEl.scrollHeight;
}

function updateCount() {
  const a = app.querySelectorAll("[data-ask]").length;
  const d = buf.size + adds.length + dels.length;
  const p = [];
  if (a) p.push(a + " аннот.");
  if (d) p.push(d + " правок");
  countEl.textContent = p.length ? "накоплено: " + p.join(", ") : "";
}

// ---- 2. Наблюдатель --------------------------------------------------------
let execWindow = false;

// §4.4: Map коалесцирует только characterData и attributes — там «старое»
// протухает к моменту разбора записи. У childList старое значение лежит
// в самой записи, коалесцировать его нельзя: потеряются отдельные узлы.
const buf  = new Map();
const adds = [];
const dels = [];

function inAsk(node) {
  const el = node && node.nodeType === 1 ? node : (node ? node.parentElement : null);
  return !!(el && el.closest && el.closest("[data-ask]"));
}

// Сырое значение для СРАВНЕНИЯ. clip() режет на CUT и схлопывает пробелы, и
// две по-настоящему разные строки, расходящиеся после 200-го символа, дают
// равенство — правка человека молча пропадает. Клипаем только на вывод.
function raw(v) { return v == null ? "" : String(v); }

// §4.6: #id, если есть; иначе путь tag:nth-of-type(n) вверх до ближайшего
// предка с id, с префиксом #app. Текстовый узел адресуется родителем.
function pathOf(node) {
  let el = node && node.nodeType === 1 ? node : (node ? node.parentElement : null);
  if (!el) return "?";
  const parts = [];
  while (el && el !== app) {
    if (el.id) { parts.unshift("#" + el.id); return parts.join(" > "); }
    const tag = el.tagName.toLowerCase();
    let n = 1;
    for (let s = el.previousElementSibling; s; s = s.previousElementSibling) {
      if (s.tagName === el.tagName) n++;
    }
    parts.unshift(tag + ":nth-of-type(" + n + ")");
    el = el.parentElement;
  }
  parts.unshift("#app");
  return parts.join(" > ");
}

function nodeBrief(n) {
  if (n.nodeType === 1) return clip(n.outerHTML);
  return "«" + clip(n.textContent) + "»";
}

// §4.2: записи, пришедшие внутри окна исполнения, отбрасываются — это правки
// модели. Атрибуция по окну, а не по isTrusted: innerHTML событий не порождает.
function process(records) {
  if (execWindow) return;
  for (const r of records) {
    if (inAsk(r.target)) continue;          // §5: набор в аннотации — не правка документа

    if (r.type === "childList") {
      for (const n of r.addedNodes)   { if (!inAsk(n)) adds.push({ where: pathOf(r.target), what: nodeBrief(n) }); }
      for (const n of r.removedNodes) { if (!inAsk(n)) dels.push({ where: pathOf(r.target), what: nodeBrief(n) }); }
    } else if (r.type === "characterData") {
      // Ключ — сам узел, а не путь: pathOf адресует текстовый узел родителем,
      // и два текстовых потомка одного элемента (<p>начало <b>ж</b> конец</p>)
      // схлопнулись бы в один ключ, потеряв вторую правку без следа.
      if (!buf.has(r.target)) {
        buf.set(r.target, { kind: "text", path: pathOf(r.target), node: r.target,
                            old: raw(r.oldValue) });
      }
    } else if (r.type === "attributes") {
      // Элементы адресуются путём однозначно, здесь коллизии нет.
      const k = "attr|" + pathOf(r.target) + "|" + r.attributeName;
      if (!buf.has(k)) {
        buf.set(k, { kind: "attr", path: pathOf(r.target), node: r.target,
                     name: r.attributeName, old: raw(r.oldValue) });
      }
    }
  }
  updateCount();
}

const observer = new MutationObserver(process);
observer.observe(app, {
  childList: true, subtree: true, characterData: true,
  attributes: true, attributeOldValue: true, characterDataOldValue: true
});

// §4.5: takeRecords() очищает очередь. Результат обязан пройти через process,
// иначе правки последнего такта пропадут молча. Внутри окна process сам их
// выбросит — это и есть «результат в мусор» из §4.2.
function drain() { process(observer.takeRecords()); }

// §4.3: .value и .checked невидимы для MutationObserver. Отдельные слушатели —
// единственный способ увидеть, что человек заполнил поле.
function fieldValue(el) {
  return (el.type === "checkbox" || el.type === "radio")
    ? String(el.checked) : String(el.value);
}

app.addEventListener("focusin", function (e) {
  const el = e.target;
  if (el && el.matches && el.matches("input,select,textarea")) el.__was = fieldValue(el);
}, true);

function fieldChanged(e) {
  // Программная установка .value событий не порождает, так что фильтр
  // отсекает только синтетику из кода модели.
  if (!e.isTrusted) return;
  const el = e.target;
  if (!el || !el.matches || !el.matches("input,select,textarea")) return;
  if (inAsk(el)) return;
  const k = "field|" + pathOf(el);
  if (!buf.has(k)) {
    buf.set(k, {
      kind:  "field",
      path:  pathOf(el),
      node:  el,
      check: el.type === "checkbox" || el.type === "radio",
      old:   raw(el.__was === undefined ? "" : el.__was)
    });
  }
  updateCount();
}

app.addEventListener("input",  fieldChanged, true);
app.addEventListener("change", fieldChanged, true);

// Пересев базовой линии: после отправки хода текущие значения полей становятся
// «старыми», иначе следующий ход повторит ту же правку.
function reseat() {
  for (const el of app.querySelectorAll("input,select,textarea")) el.__was = fieldValue(el);
}

// ---- 3. Аннотации ----------------------------------------------------------
let nid = 0;

function ensureId(el) {
  if (!el.id) {
    do { nid++; } while (document.getElementById("n" + nid));
    el.id = "n" + nid;
  }
  return el.id;
}

function topLevel(node) {
  let el = node && node.nodeType === 1 ? node : (node ? node.parentNode : null);
  while (el && el.parentNode && el.parentNode !== app) el = el.parentNode;
  return el && el.parentNode === app ? el : null;
}

function addAsk() {
  drain();                           // чужие записи забираем ДО подъёма окна,
  const prevWindow = execWindow;     // ход модели мог поднять окно: канва во
  execWindow = true;                 // время хода не заблокирована, человек
  try {                              // может поставить аннотацию посреди него
    const sel = document.getSelection();
    const from = sel && sel.anchorNode && app.contains(sel.anchorNode) ? sel.anchorNode : null;
    let anchor = from ? topLevel(from) : null;
    // Голый текстовый узел прямо в #app: так Chrome держит первую строку, пока
    // человек не нажал Enter. Прямого потомка-элемента нет, а якорю нужен узел,
    // который унесёт id — оборачиваем в <p> на месте.
    if (!anchor && from && from.nodeType === 3 && from.parentNode === app) {
      anchor = document.createElement("p");
      from.before(anchor);
      anchor.appendChild(from);
    }
    if (!anchor) anchor = app.lastElementChild;
    if (!anchor) {
      anchor = document.createElement("p");
      anchor.textContent = " ";
      app.appendChild(anchor);
    }
    if (anchor.matches("[data-ask]")) return;

    const id = ensureId(anchor);
    const aside = document.createElement("aside");
    aside.setAttribute("data-ask", "#" + id);
    aside.setAttribute("contenteditable", "true");
    anchor.after(aside);

    const r = document.createRange();
    r.selectNodeContents(aside);
    r.collapse(true);
    const s = document.getSelection();
    s.removeAllRanges();
    s.addRange(r);
    aside.focus();
    updateCount();
    return aside;
  } finally {
    drain();                         // записи о собственных правках — в мусор
    execWindow = prevWindow;
  }
}

function collectAsks() {
  const out = [];
  const nodes = Array.prototype.slice.call(app.querySelectorAll("[data-ask]"));
  for (const a of nodes) {
    const text = a.textContent.replace(/\s+/g, " ").trim();
    if (text) out.push("[к " + a.getAttribute("data-ask") + "] " + text);
    a.remove();
  }
  return out;
}

// ---- 4. Диф ----------------------------------------------------------------
function clip(s) {
  s = String(s == null ? "" : s).replace(/\s+/g, " ").trim();
  return s.length > CUT ? s.slice(0, CUT) + "…" : s;
}

function diffLines() {
  const out = [];
  for (const e of buf.values()) {
    if (e.kind === "text") {
      const now = raw(e.node.nodeValue);
      if (now !== e.old) {
        out.push(e.path + " текст: «" + clip(e.old) + "» → «" + clip(now) + "»");
      }
    } else if (e.kind === "attr") {
      const now = raw(e.node.getAttribute ? e.node.getAttribute(e.name) : null);
      if (now !== e.old) {
        out.push(e.path + " @" + e.name + ": «" + clip(e.old) + "» → «" + clip(now) + "»");
      }
    } else if (e.kind === "field") {
      const now = raw(fieldValue(e.node));
      if (now !== e.old) {
        out.push(e.path + (e.check ? " галочка: «" : " поле: «") +
                 clip(e.old) + "» → «" + clip(now) + "»");
      }
    }
  }
  for (const a of adds) out.push(a.where + " + " + a.what);
  for (const d of dels) out.push(d.where + " − " + d.what);

  buf.clear();
  adds.length = 0;
  dels.length = 0;

  if (out.length > MAX_DIFF) {
    const n = out.length;
    out.length = MAX_DIFF;
    out.push("… ещё " + (n - MAX_DIFF) + " правок не показано");
  }
  return out;
}

// Атомарный блок (§6): ни одного await между добором записей и снятием
// аннотаций. Иначе человек успеет набрать в промежутке, и текст пропадёт.
function takeDiff() {
  drain();                       // 1. добираем правки человека последнего такта
  const lines = diffLines();     // 2. собираем диф и чистим буферы
  execWindow = true;             // 3. снятие аннотаций — правка системы, не человека
  let asks;
  try {
    asks = collectAsks();
    reseat();                    // §6: пересев базовой линии — в том же блоке
  } finally {
    drain();                     // execWindow ещё true → записи об удалении в мусор
    execWindow = false;
  }
  updateCount();
  return { asks: asks, lines: lines };
}

function turnMessage(d) {
  const parts = [];
  if (d.asks.length)  parts.push("ИНСТРУКЦИИ (" + d.asks.length + "):\n" + d.asks.join("\n"));
  if (d.lines.length) parts.push("ПРАВКИ ДОКУМЕНТА (" + d.lines.length + "):\n" + d.lines.join("\n"));
  return parts.length ? parts.join("\n\n") : "Человек отправил ход, ничего не изменив.";
}

// ---- 5. Исполнение ---------------------------------------------------------
function serialize(v) {
  if (v === undefined) return "ok";
  if (typeof v === "string") return v;
  if (v instanceof Node) {
    return v.outerHTML !== undefined ? v.outerHTML : String(v.textContent);
  }
  if (v instanceof NodeList || Array.isArray(v)) {
    return Array.from(v).map(function (x) {
      if (x instanceof Node) return x.outerHTML !== undefined ? x.outerHTML : String(x.textContent);
      try { return JSON.stringify(x); } catch (e) { return String(x); }
    }).join("\n");
  }
  try {
    const s = JSON.stringify(v);
    return s === undefined ? String(v) : s;
  } catch (e) {
    return String(v);
  }
}

function cut(s) {
  s = String(s);
  return s.length > MAX_RESULT
    ? s.slice(0, MAX_RESULT) + "\n… обрезано, всего " + s.length + " симв."
    : s;
}

function errText(e) {
  const name = e && e.name ? e.name : "Error";
  const msg  = e && e.message ? e.message : String(e);
  const head = name + ": " + msg;
  // Режем не только число строк стека, но и каждую по длине: кадр бывает
  // произвольно длинным (у страницы, открытой как data:, в него попадает весь
  // исходник), и тогда модель получит MAX_RESULT символов мусора вместо
  // диагноза — а вместе с ним и всё, что в исходнике лежит.
  const st = e && e.stack
    ? String(e.stack).split("\n").slice(1, 4)
        .map(function (l) { return l.length > CUT ? l.slice(0, CUT) + "…" : l; })
        .join("\n")
    : "";
  return st ? head + "\n" + st : head;
}

function exec(code) {
  const fn = new Function("return (async () => {" + code + "})()");
  return fn();
}

async function runTool(code) {
  execWindow = true;
  try {
    const v = await exec(code);
    return { text: cut(serialize(v)), err: null };
  } catch (e) {
    return { text: cut(errText(e)), err: e };
  } finally {
    drain();            // §4.2: колбэк наблюдателя асинхронный — доберём и выбросим
    execWindow = false; // до снятия флага, иначе правки модели спишутся на человека
  }
}

function checkFrame() {
  const parts = [["app", app], ["store", store], ["io", io], ["debug", debugEl],
                 ["log", logEl], ["state", stateEl], ["count", countEl],
                 ["send", sendBtn], ["stop", stopBtn]];
  let ok = true;
  for (const [id, node] of parts) {
    if (document.getElementById(id) !== node || !node.isConnected) { ok = false; break; }
  }
  if (!ok) {
    alert("Каркас страницы разрушен. Перезагружаю.");
    location.reload();
  }
  return ok;
}

// ---- 6. Петля --------------------------------------------------------------
const SYSTEM = `Ты работаешь внутри одной HTML-страницы. Твоё единственное действие — инструмент page_exec: он выполняет переданный JavaScript в этой странице и возвращает тебе то значение, которое вернул код.

Код исполняется как тело async-функции. Чтобы увидеть значение, верни его через return: без return ты получишь "ok" и решишь, что вызов удался, ничего не прочитав. await доступен.

Снимок страницы тебе не присылают никогда. Нужно знать состояние — прочитай его сам вызовом page_exec.

Карта страницы:
- #app — канва, contenteditable. Это одновременно документ человека и твой ответ ему. Ответ человеку — то, что записано сюда, а не текст твоего сообщения.
- #store — скрытый слой данных (hidden). Состояние держи здесь, а не в вёрстке #app.
- #io и #debug — каркас системы. Не трогай их и не трогай body целиком.

Ход человека приходит двумя разделами:
- ИНСТРУКЦИИ — задание, привязанное к узлу. Это то, что от тебя хотят.
- ПРАВКИ ДОКУМЕНТА — новое состояние текста после правок человека. Обычно контекст, действия не требует.
Аннотации к этому моменту уже сняты со страницы, восстанавливать их не нужно.

Правила:
- Состояние переживает ход. Не перевыводи то, что уже записано на странице.
- Вешай id на узлы, которые собираешься читать в следующих ходах.
- #app редактируем целиком, и это ценно: человек правит текст руками, а ты получаешь его правки разделом ПРАВКИ ДОКУМЕНТА. Не отнимай у него эту возможность.
- contenteditable="false" ставь на САМ интерактивный элемент — кнопку, input, select — и только на него, иначе клик поставит каретку вместо нажатия.
- Атрибут наследуется: contenteditable="false" на контейнере отключает правку всего, что внутри. Никогда не вешай его на абзац, список, таблицу или ячейку — человек перестанет их редактировать. Если внутри нередактируемого островка нужно редактируемое поле, поставь на него contenteditable="true" явно.
- Текст, который человеку предстоит править, оставляй редактируемым и вешай на него id, чтобы прочитать потом.
- Всегда проверяй результат querySelector на null: каретка человека ломает структуру и уносит id.
- Текст, набранный человеком в input, живёт в свойстве .value, а не в разметке — в outerHTML его не видно. Читай .value и .checked.
- Если код бросил исключение, ты получишь его текстом. Это штатный способ починиться: поправь код и повтори.`;

const TOOLS = [{
  type: "function",
  function: {
    name: "page_exec",
    description: "Выполнить JavaScript в текущей странице. Код исполняется как тело async-функции: возвращай результат через return, иначе получишь \"ok\". Доступен await.",
    parameters: {
      type: "object",
      properties: { code: { type: "string" } },
      required: ["code"]
    }
  }
}];

const messages = [{ role: "system", content: SYSTEM }];
let busy = false;
let ctl = null;

function setBusy(v) {
  busy = v;
  stateEl.textContent = v ? "работает" : "готов";
  sendBtn.disabled = v;
  stopBtn.disabled = !v;
  // Канва только для чтения на время хода. Правка, сделанная внутри окна
  // исполнения, спишется на модель и пропадёт молча (§10, гонка авторства):
  // текст в DOM изменится, а диф скажет «ничего не изменив». Запретить
  // дешевле, чем потерять.
  // Аннотации при этом работают: <aside> несёт собственный
  // contenteditable="true", а его текст читается из DOM при коммите, а не из
  // буфера наблюдателя, — и ход переживает.
  // Смена атрибута — работа системы, поэтому внутри окна: иначе наблюдатель
  // положит её в буфер и счётчик покажет человеку правку, которой он не делал.
  const prev = execWindow;
  execWindow = true;
  try { app.contentEditable = v ? "false" : "true"; }
  finally { drain(); execWindow = prev; }
}

async function callModel(extra) {
  const body = { model: MODEL, messages: messages, tools: TOOLS };
  if (extra) Object.assign(body, extra);
  const r = await fetch(API_URL, {
    method: "POST",
    headers: { "content-type": "application/json", "authorization": "Bearer " + API_KEY },
    body: JSON.stringify(body),
    signal: ctl.signal
  });
  if (!r.ok) {
    const t = await r.text();
    throw new Error("HTTP " + r.status + ": " + t.slice(0, 500));
  }
  return await r.json();
}

// Ход может оборваться посреди пачки вызовов, а messages переживает ход.
// Вызов без ответного tool-сообщения делает КАЖДЫЙ следующий запрос сессии
// невалидным: провайдер видит assistant.tool_calls, на который не хватает
// ответов, и отвечает 400 на ходах, выглядящих непричастными.
function closeBatch(calls, after) {
  for (const rest of calls.slice(calls.indexOf(after) + 1)) {
    messages.push({ role: "tool", tool_call_id: rest.id || "unknown",
                    content: "Ход завершён принудительно, вызов не выполнен." });
  }
}

async function runTurn() {
  let lastSig = "";
  let same = 0;

  for (let i = 1; i <= MAX_ITERS + 1; i++) {
    const last = i > MAX_ITERS;
    if (last) {
      messages.push({
        role: "user",
        content: "Лимит итераций исчерпан. Заверши ход: коротко скажи, что сделано и что осталось."
      });
      log("предел", "MAX_ITERS исчерпан, финальный вызов с tool_choice: none");
    }

    const data = await callModel(last ? { tool_choice: "none" } : null);
    const ch = data.choices && data.choices[0];
    if (!ch) { log("сбой", "ответ без choices: " + JSON.stringify(data).slice(0, 500)); return; }

    const m = ch.message;
    if (!m) {
      log("сбой", "ответ без message: " + JSON.stringify(ch).slice(0, 500));
      return;
    }
    const fin = ch.finish_reason;
    const calls = m.tool_calls || [];
    messages.push(m);
    if (m.content) log("текст", m.content);

    // Отклонение от §7: критерий — непустой tool_calls. finish_reason у
    // OpenAI-совместимых клонов часто врёт; расхождение фиксируем в журнале.
    if (calls.length && fin !== "tool_calls") {
      log("провайдер", "tool_calls непуст, но finish_reason = " + fin);
    }
    if (!calls.length) { log("ход", "завершён, finish_reason = " + fin); return; }

    for (const c of calls) {
      let code = null;
      try {
        code = JSON.parse(c.function.arguments).code;
      } catch (e) {
        const out = "Не удалось разобрать аргументы вызова: " + errText(e) +
                    "\nВероятно, ответ оборвался по лимиту токенов. Пришли код короче.";
        log("аргументы", out);
        messages.push({ role: "tool", tool_call_id: c.id || "unknown", content: out });
        continue;
      }

      // Аргументы разобрались, но поля code нет: runTool(undefined) вернул бы
      // "ok", и модель сочла бы вызов успешным. Снимка страницы она не получает
      // и уличить ложь не сможет.
      if (typeof code !== "string") {
        const out = "В аргументах вызова нет строкового поля code. " +
                    "Повтори вызов, положив код в поле code.";
        log("аргументы", out);
        messages.push({ role: "tool", tool_call_id: c.id || "unknown", content: out });
        continue;
      }

      log("exec", code);
      const res = await runTool(code);
      log(res.err ? "ошибка" : "результат", res.text);
      messages.push({ role: "tool", tool_call_id: c.id || "unknown", content: res.text });

      if (res.err) {
        const sig = (res.err.name || "Error") + ": " + (res.err.message || "");
        if (sig === lastSig) same++; else { lastSig = sig; same = 1; }
        if (same >= 3) {
          log("стоп", "три одинаковых исключения подряд, ход завершён принудительно");
          closeBatch(calls, c);
          return;
        }
      } else {
        lastSig = ""; same = 0;
      }

      if (!checkFrame()) return;
    }

    if (last) return;
  }
}

async function commit() {
  if (busy) { log("занято", "ход уже идёт, отправка пропущена"); return; }
  const msg = turnMessage(takeDiff());
  log("ход", msg);
  messages.push({ role: "user", content: msg });
  ctl = new AbortController();
  setBusy(true);
  try {
    await runTurn();
  } catch (e) {
    if (e && e.name === "AbortError") log("стоп", "ход прерван человеком");
    else log("сбой", errText(e));
  } finally {
    setBusy(false);
    ctl = null;
  }
}

// ---- 7. Привязки -----------------------------------------------------------
app.addEventListener("contextmenu", function (e) {
  if (e.shiftKey) return;            // Shift оставляет родное меню браузера
  e.preventDefault();
  addAsk();
});

app.addEventListener("keydown", function (e) {
  if ((e.ctrlKey || e.metaKey) && e.code === "Slash") { e.preventDefault(); addAsk(); }
});

// Escape — на document, а не на #app: у свежесозданного пустого <aside> фокус
// остаётся на <body> (aside.focus() на пустом contenteditable не срабатывает),
// и до слушателя на #app событие тогда не доходит вовсе. Аннотацию ищем по
// каретке, а не только по цели события, по той же причине: выделение стоит
// внутри аннотации даже когда activeElement — <body>.
document.addEventListener("keydown", function (e) {
  if (e.key !== "Escape") return;
  let a = e.target && e.target.closest ? e.target.closest("[data-ask]") : null;
  if (!a) {
    const sel = document.getSelection();
    const n = sel ? sel.anchorNode : null;
    const el = n ? (n.nodeType === 1 ? n : n.parentElement) : null;
    a = el && el.closest ? el.closest("[data-ask]") : null;
  }
  if (a && app.contains(a) && !a.textContent.trim()) {
    e.preventDefault();
    a.remove();          // удаление аннотации в диф не идёт: inAsk ловит сам узел
    app.focus();
    updateCount();
  }
});

app.addEventListener("input", updateCount);

document.addEventListener("keydown", function (e) {
  if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); commit(); }
});

sendBtn.addEventListener("click", function () { commit(); });

stopBtn.addEventListener("click", function () { if (ctl) ctl.abort(); });

log("старт", "каркас поднят");
</script>
